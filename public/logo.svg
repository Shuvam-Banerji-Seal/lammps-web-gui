<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ga" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a8c89a"/>
      <stop offset="100%" stop-color="#47693b"/>
    </radialGradient>
    <radialGradient id="gb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8c89a"/>
      <stop offset="100%" stop-color="#b97f3e"/>
    </radialGradient>
    <radialGradient id="gc" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8fb87a"/>
      <stop offset="100%" stop-color="#3a5c32"/>
    </radialGradient>
    <clipPath id="rr">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Rounded-square dark background -->
  <rect width="64" height="64" rx="14" fill="#16130f"/>

  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="14" fill="#7fa66b" opacity="0.04"/>

  <g clip-path="url(#rr)">
    <!-- Bonds — hexagonal ring + spokes to centre -->
    <g stroke="#4a5e4a" stroke-width="2.5" stroke-linecap="round">
      <line x1="32" y1="10" x2="51" y2="21"/>
      <line x1="51" y1="21" x2="51" y2="43"/>
      <line x1="51" y1="43" x2="32" y2="54"/>
      <line x1="32" y1="54" x2="13" y2="43"/>
      <line x1="13" y1="43" x2="13" y2="21"/>
      <line x1="13" y1="21" x2="32" y2="10"/>
    </g>
    <g stroke="#3d5040" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="32" y1="10" x2="32" y2="32"/>
      <line x1="51" y1="43" x2="32" y2="32"/>
      <line x1="13" y1="43" x2="32" y2="32"/>
    </g>

    <!-- Centre atom — amber, largest -->
    <circle cx="32" cy="32" r="8.5" fill="url(#gb)"/>
    <circle cx="29.5" cy="29.5" r="2.8" fill="#fff" opacity="0.35"/>

    <!-- Ring vertices — sage green, alternating sizes -->
    <circle cx="32" cy="10" r="6" fill="url(#ga)"/>
    <circle cx="30" cy="8" r="2" fill="#fff" opacity="0.3"/>

    <circle cx="51" cy="21" r="5" fill="url(#gc)"/>
    <circle cx="49.5" cy="19.5" r="1.6" fill="#fff" opacity="0.28"/>

    <circle cx="51" cy="43" r="5.5" fill="url(#ga)"/>
    <circle cx="49.5" cy="41.5" r="1.8" fill="#fff" opacity="0.3"/>

    <circle cx="32" cy="54" r="5" fill="url(#gc)"/>
    <circle cx="30.5" cy="52.5" r="1.6" fill="#fff" opacity="0.28"/>

    <circle cx="13" cy="43" r="5.5" fill="url(#ga)"/>
    <circle cx="11.5" cy="41.5" r="1.8" fill="#fff" opacity="0.3"/>

    <circle cx="13" cy="21" r="5" fill="url(#gc)"/>
    <circle cx="11.5" cy="19.5" r="1.6" fill="#fff" opacity="0.28"/>
  </g>
</svg>
