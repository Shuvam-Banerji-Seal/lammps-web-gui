<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="atom-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="atom-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine1" cx="35%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="shine2" cx="35%" cy="35%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Bonds -->
  <line x1="20" y1="18" x2="40" y2="28" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="28" x2="20" y2="44" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="28" x2="52" y2="44" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <!-- Atoms -->
  <circle cx="20" cy="18" r="8" fill="url(#atom-grad)"/>
  <circle cx="20" cy="18" r="8" fill="url(#shine1)"/>
  <circle cx="40" cy="28" r="10" fill="url(#atom-grad2)"/>
  <circle cx="40" cy="28" r="10" fill="url(#shine2)"/>
  <circle cx="20" cy="44" r="7" fill="#f87171"/>
  <circle cx="20" cy="44" r="7" fill="url(#shine1)"/>
  <circle cx="52" cy="44" r="6" fill="#fbbf24"/>
  <circle cx="52" cy="44" r="6" fill="url(#shine1)"/>
</svg>
