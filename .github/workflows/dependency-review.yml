name: Dependency review

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # This project ships under a non-commercial licence of its own, so a
          # copyleft dependency would force a licence conflict on redistribution.
          deny-licenses: >-
            GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0,
            SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
