      <h1>LAMMPS Web GUI — run LAMMPS molecular dynamics in your browser</h1>
      <p>LAMMPS Web GUI is a free (for education and research) browser-based workbench for the LAMMPS
        molecular dynamics code. It needs JavaScript and WebGL 2 to run.</p>
      <ul>
        <li>MD notebook: run LAMMPS input scripts in the browser, with thermo tables, live charts and a 3D view.
          The engine is checked against native LAMMPS.</li>
        <li>Script builder: build LAMMPS input scripts as a flowchart, with a script check that cites docs.lammps.org.</li>
        <li>Compiler helper: CMake build scripts for LAMMPS packages and accelerators.</li>
        <li>3D viewer: LAMMPS data and dump files, XYZ, PDB and CIF, with trajectory playback and RDF/MSD analysis.</li>
      </ul>
      <p>Source code and documentation:
        <a href="https://github.com/Shuvam-Banerji-Seal/lammps-web-gui">github.com/Shuvam-Banerji-Seal/lammps-web-gui</a>.
